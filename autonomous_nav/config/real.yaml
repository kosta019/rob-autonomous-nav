# Parámetros para el robot REAL (tercer --params-file). Orden de los ficheros, cada uno
# sobrescribe al anterior:
#   fase1.yaml, fase1_ruta.yaml, real.yaml y, si existe, initial_pose_corregida.yaml el último.
# A 0.08 m/s la ruta completa dura unos 4-5 min.
fase1_node:
  ros__parameters:
    use_sim_time: false
    max_linear_speed: 0.08
    tol_mandatory: 0.02          # con 0.03 se paraba ~2.7 cm antes de B. Si da vueltas cerca de un punto, volver a 0.03
    tol_final_yaw: 0.03
    # Red de seguridad (05/11): en la ruta completa una persona cruzó a 1 m de E y el robot no la olvidó en 60 s
    # (los rayos daban 0.0, que antes no borraba, y con 30 s de memoria la gente que pasaba reiniciaba la cuenta).
    obstacle_memory_time: 8.0
    # Rumbo de /odom (integra en el robot, no depende de la WiFi). Prueba del 05/11: 4 vueltas,
    # error -1.3° (odom) y -1.9° (imu) frente a las paredes. yaw_imu se sigue escribiendo en el log.
    # Ojo: el driver del TB3 (odometry.use_imu: true) saca el rumbo de /odom del IMU de la OpenCR, no de las
    # ruedas. Si se inclina o se sacude el robot, ese rumbo salta (05/11: 131° al cogerlo con la mano).
    use_imu_yaw: false
    # Desfase de rumbo del LiDAR de ESTE robot (BOT 11), en rad; positivo = LiDAR girado a la izquierda.
    # Solo lo usa comprobar_pose (fase1_node todavía no). Dos A->B del 05/11:
    #   1ª: 1.49° (0.026), con la salida supuesta = comprobar_pose + 4 cm de canaleta (sin cinta en A);
    #   2ª, ya con 0.026: el robot avanzó 0.46° a la izquierda de lo que creía -> 1.03° (0.018), cinta en A y B.
    # Se toma 0.019 (1.09°): casi el valor de la 2ª, que se midió con cinta en los dos extremos.
    lidar_yaw_offset: 0.019
