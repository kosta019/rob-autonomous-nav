# Parámetros para el robot real. Se pasa después de fase1.yaml y fase1_ruta.yaml, y sobrescribe lo que se repita.
fase1_node:
  ros__parameters:
    use_sim_time: false
    # Más lento que en Gazebo: a velocidad alta el rumbo derivaba unos grados a lo largo de la ruta
    max_linear_speed: 0.20       # m/s
    max_angular_speed: 0.4       # rad/s, más suave que en fase1.yaml. Solo satura los giros de más de ~15°
    tol_mandatory: 0.02          # m. Con 0.03 el robot se paraba unos 2.7 cm antes de B
    tol_final_yaw: 0.03          # rad
    # Si alguien cruza por delante, el robot lo olvida pronto y no se queda bloqueado
    obstacle_memory_time: 8.0    # s
    # Con 0.40 m de ruta vigilada, el robot se para a 0.44-0.65 m del obstáculo, fuera del inflado
    block_lookahead: 0.40        # m
    obstacle_wait_time: 2.0      # s
    # El rumbo de /odom se integra dentro del robot, así que un corte de WiFi no pierde giro. El driver lo saca del
    # IMU de la OpenCR: si se coge el robot con la mano, ese rumbo salta
    use_imu_yaw: false
    # El montaje del LiDAR está bien alineado: el rumbo medido contra la pared izquierda coincide con el real
    lidar_yaw_offset: 0.0        # rad
    map_corr_mode: "activo"      # corrección con el mapa de distancias
    # La Y estimada llega a la puerta con un error que crece con la velocidad, hasta unos 0.5 m
    reloc_max_dy: 0.65           # m
    # Esquina de Q medida con cinta desde la cruz de Q: el mapa está mal en Y (unos 0.22 m)
    reloc_q_wall_x: 9.570        # m, pared de delante
    reloc_q_wall_y: 13.997       # m, pared de la derecha
    # Pared larga del pasillo, medida con cinta (el mapa dice 16.90). Solo se corrige la Y: el rumbo del IMU es mejor
    # y la pared del fondo no es perpendicular a ella
    # 09/11: "sombra" (solo registra CORR_PASILLO_SOMBRA, no mueve la pose) hasta ver con un bag por qué no actuó en la
    # misión de las 14:31 (0 eventos). Si se entiende y cuenta puntos, volver a "activo".
    corridor_corr_mode: "sombra"
    # Segunda pared: lado de la sala del tramo ancho, medida con cinta desde la cruz de P Base: 2.39 m -> Y = 15.70 - 2.39
    corridor_wall_axis: ["y", "y"]
    corridor_wall_value: [17.15, 13.31] # m
    corridor_wall_from: [-0.55, 1.32]   # m
    corridor_wall_to: [9.57, 5.18]      # m
    # Velocidad en el pasillo (fase II). 0.12 en las primeras pruebas; subida el 09/11 tras dos misiones I+II completas
    phase2_max_linear_speed: 0.20   # m/s
    # Corrige la pose de salida con el LiDAR al arrancar
    start_pose_check: true
