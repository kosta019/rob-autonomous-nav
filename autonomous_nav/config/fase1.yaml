# Parámetros de la fase I (fase1_node). Coordenadas en metros, en el sistema del enunciado (ver CLAUDE.md).
# Formato de parámetros de ROS 2:
#   - no admite listas anidadas, así que los puntos y los rectángulos van en arrays paralelos;
#   - en los arrays de reales, todos los números llevan decimal (0.0, no 0), o ROS dará un error de tipo.
# El script offline del paso 2 lee este mismo fichero con PyYAML: yaml.safe_load(f)["fase1_node"]["ros__parameters"].

fase1_node:
  ros__parameters:

    # ---------- Poses (las asigna el profesor en la demo) ----------
    initial_pose: [0.700, 0.920, 0.0]      # [x, y, theta(rad)]. PROVISIONAL: punto A mirando a +X
    final_pose:   [8.970, 14.497, 0.0]     # [x, y, theta(rad)]. PROVISIONAL: Q. La pose real está en la zona 2

    # ---------- Ruta (salida desde A) ----------
    # Calculada con el Distance Transform con costes sobre maps/mapa_1cm.png (inflado 0.25 m).
    # No empieza en A porque A es la salida. Desde B: quitar "B". Desde D: quitar "B" y "D".
    # Desde C: PENDIENTE (faltan las mesas). El paso 2 genera config/fase1_ruta.yaml, que sobrescribe estos tres arrays.
    waypoint_names: ["B", "D", "E", "pre_door", "Door", "post_door_1", "post_door_2", "Q"]
    waypoints_x:    [3.102, 5.285, 5.082, 5.960, 6.490, 7.420, 7.960, 8.970]
    waypoints_y:    [1.722, 2.517, 6.122, 11.660, 11.682, 12.360, 14.160, 14.497]
    mandatory_waypoints: ["E", "Door", "Q"]   # en este orden; su precisión se evalúa

    # ---------- Control (valores de partida, ajustables) ----------
    control_rate: 10.0           # Hz del timer de control
    tol_waypoint: 0.07           # m, llegada a waypoints intermedios
    tol_mandatory: 0.02          # m, llegada a E, Door, Q y pose final. El robot para justo al entrar: el error es ~tol (con 0.05 daba 4.8 cm)
    tol_final_yaw: 0.02          # rad (~1 grado). Igual: el error final es ~tol
    max_linear_speed: 0.15       # m/s (máximo del Burger: 0.22)
    max_angular_speed: 0.8       # rad/s (máximo del Burger: 2.84)
    k_linear: 0.5                # v = k_linear * distancia, limitada a max_linear_speed
    k_angular: 1.5               # w = k_angular * error_angulo, limitada a max_angular_speed
    turn_in_place_angle: 0.17    # rad (~10 grados): con más error, girar sin avanzar
    reorient_angle: 0.52         # rad (~30 grados): si avanzando el error supera esto, volver a GIRAR

    # ---------- Seguridad ----------
    stop_distance: 0.30          # m, medida desde el LiDAR, en el cono frontal
    stop_half_angle_deg: 30.0    # semiancho del cono frontal
    scan_timeout: 0.5            # s sin /scan (o sin /odom): parada total

    # ---------- Obstáculos nuevos y replanificación (paso 3) ----------
    static_clearance_file: "maps/holgura_5cm.npy"   # relativo a share/autonomous_nav; lo genera el paso 2 (+ .yaml)
    obstacle_static_margin: 0.20 # m: una lectura es obstáculo NUEVO si la holgura estática allí es mayor (la deriva desplaza
                                 #   las paredes; con 0.15 salían paredes desplazadas 16 cm como obstáculos en el vestíbulo)
    obstacle_plan_margin: 0.10   # m: al replanificar, los obstáculos nuevos cuentan como si fueran esto más grandes
    obstacle_clear_scans: 3      # escaneos SEGUIDOS viendo libre un obstáculo para olvidarlo (una lectura suelta no basta)
    obstacle_clear_zero_min_dist: 0.5  # m: una lectura 0.0 (LDS real: nada hasta range_max) cuenta como libre solo si el
                                 #   obstáculo está más lejos que esto (0.0 también es "más cerca que range_min")
    obstacle_memory_time: 30.0   # s sin volver a ver un obstáculo para olvidarlo
    obstacle_clear_margin: 0.10  # m: se olvida antes si un rayo del LiDAR pasa esto más allá de él (se ha ido)
    obstacle_log_spacing: 0.20   # m: un obstáculo va al Mission Log si está a esto de los ya registrados
    obstacle_max_range: 2.5      # m: más lejos, un error pequeño de rumbo ya desplaza mucho la lectura
    obstacle_min_range: 0.20     # m: más cerca no se recuerda (propio robot, ecos de la ventana sucia: 05/11 a 12-17 cm).
                                 #   La parada de emergencia no lo usa. comprobar_pose avisa si hay ecos más cerca.
    obstacle_max_turn_rate: 0.2  # rad/s: girando más deprisa no se actualiza la memoria (el scan llega con retraso
                                 #   y las paredes aparecen desplazadas: con 0.8 rad/s se veían obstáculos falsos)
    block_lookahead: 1.5         # m de ruta por delante en los que se busca bloqueo (a menos de inflation_radius)
    block_hysteresis: 0.10       # m: para dar la ruta por LIBRE se pide esto de más (en distancia y en alcance)
    obstacle_wait_time: 3.0      # s parado antes de replanificar (por si es una persona que pasa)
    replan_retry_period: 5.0     # s entre reintentos si no hay camino
    inflation_radius_retry: 0.20 # m, segundo intento si no hay camino; el tercero es inflation_radius_min

    # ---------- Robot ----------
    lidar_offset_x: -0.032       # m, posición del LiDAR (base_scan) sobre el eje del robot. Del URDF turtlebot3_burger (scan_joint)
    use_imu_yaw: true            # rumbo integrando el giróscopo de /imu (como el driver del TB3 real). false: rumbo de /odom
    lidar_yaw_offset: 0.0        # rad: desfase de montaje del LiDAR (positivo = girado a la izquierda). comprobar_pose y la
                                 #   relocalización lo restan al rumbo de las paredes. 05/11: 0 (ver real.yaml y CLAUDE.md)
    pose_heading_axis: "Y"       # comprobar_pose: el rumbo sale solo de las caras de este eje ("Y" = pared izquierda,
                                 #   y = 0.04); la posición, de todas. Las dos paredes de A difieren 1.76° (05/11). "" = todas

    # ---------- Relocalización con la pared de la puerta (robot parado): rumbo y X de la recta, Y del borde cercano ----------
    reloc_waypoints: ["E-Door_1"] # al llegar a estos waypoints (una vez cada uno). Antes de la puerta: 05/11 llegó con 14 cm de error
    reloc_scans: 10              # scans que se juntan (mediana): a 5 Hz, unos 2 s parado
    reloc_wall_x: 6.39           # m: X de la pared de la puerta (lado sala) para relocalizar. Mapa: 6.34 (el planificador
                                 #   la sigue usando: conservador). Medido 05/11 desde G (0.91 m) y la sala (5.91 m): ~6.39
    reloc_door_y: [11.27, 12.02] # m: bordes del hueco en el mapa (medidos desde G: coinciden). La Y usa el primero (cercano)
    reloc_door_width: 0.76       # m: ancho medido del hueco. Solo AVISO (la hoja abierta hacia la sala tapa el lado lejano);
                                 #   la Y sale del borde cercano (11.27)
    reloc_door_width_tol: 0.06   # m: LiDAR de 1° a ~1 m: ~1.7 cm por borde
    reloc_band: 0.35             # m: puntos a menos de esto de x = reloc_wall_x con la pose creída (tolera 0.30 m de error)
    reloc_wall_length: 1.0       # m de pared que se usan a cada lado del hueco
    reloc_max_rms: 0.02          # m: residuo máximo de la recta de pared para aceptar la corrección
    reloc_min_points: 30         # puntos de pared mínimos (los dos lados del hueco)
    reloc_min_points_near: 10    # puntos mínimos del tramo de pared del lado cercano (11.27) para corregir la Y
    reloc_max_dist: 0.30         # m: corrección de posición máxima; más, se rechaza (RELOC_RECHAZADA dxy)
    reloc_max_angle_deg: 3.0     # grados: corrección de rumbo máxima

    # ---------- Log ----------
    log_file: "mission_log.csv"
    log_period: 0.5              # s entre filas periódicas

    # ---------- Mapa y planificador (pasos 2 y 3) ----------
    map_image: "maps/mapa_1cm.png"
    map_resolution: 0.01         # m/píxel (deducido de las cotas de la figura)
    map_origin_row: 71.0         # borde de píxel donde X = 0: fila = floor(100*X + 71)
    map_origin_col: 2.0          # borde de píxel donde Y = 0: col = floor(100*Y + 2)
    map_remove_rows: [502]       # motas sueltas que hay que borrar
    map_remove_cols: [1217]
    grid_cell: 0.05              # m, rejilla del planificador
    inflation_radius: 0.25       # m. NUNCA más de 0.30: con 0.33 la puerta se cierra
    inflation_radius_min: 0.18   # m, último reintento si no hay camino (paso 3)
    clearance_target: 0.60       # m, a partir de aquí no hay penalización por cercanía
    clearance_cost_gain: 3.0
    simplify_clearance_cap: 0.45 # m, la simplificación no exige más holgura que esto
    simplify_margin: 0.02        # m, un atajo puede perder esto respecto al camino de celdas
    simplify_step: 0.01          # m, muestreo de los segmentos (sobre el mapa de 1 cm)
    planning_sequence: ["A", "B", "D", "E", "Door", "Q"]   # el paso 2 planifica tramo a tramo esta secuencia

    # Puntos del enunciado (v2), necesarios para el planificador
    point_names: ["A", "B", "C", "D", "E", "F", "G", "Door", "Q", "R", "S", "T", "Base"]
    point_x:     [0.700, 3.102, 2.078, 5.285, 5.082, 5.679, 5.482, 6.490, 8.970, 7.500, 3.540, 2.136, 3.340]
    point_y:     [0.920, 1.722, 2.517, 2.517, 6.122, 8.528, 10.930, 11.682, 14.497, 16.170, 14.497, 15.300, 15.700]

    # Zonas prohibidas que no están en el mapa (rectángulos en coordenadas del mundo)
    # ESTIMADAS desde la figura del enunciado: hay que medirlas en el laboratorio.
    # TODO: añadir las mesas entre B y C (zona 1) cuando estén medidas.
    # hoja_puerta: la hoja abierta del todo hacia la sala, perpendicular al hueco, con las bisagras en el borde lejano
    #   (Y ~ 12.03). Vista en el bag del 05/11 en Y 12.08-12.13, X 5.59-6.34 (0.75 m). El LiDAR la ve, pero tapa el
    #   lado lejano del hueco; no se usa para relocalizar.
    nogo_names: ["suelo_irregular_vestibulo", "suelo_irregular_pasillo", "hoja_puerta"]
    nogo_x_min: [8.05, -0.55, 5.58]
    nogo_x_max: [8.72, 4.59, 6.34]
    nogo_y_min: [11.79, 15.85, 12.03]
    nogo_y_max: [12.95, 16.90, 12.13]
