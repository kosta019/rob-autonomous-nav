# Salida desde C: el robot parte sobre la cruz de C mirando a +X. Se pasa como último --params-file.
# Con plan_at_start, el robot parado mira alrededor y planifica desde aquí. El nodo corrige la pose al arrancar.
fase1_node:
  ros__parameters:
    initial_pose: [2.078, 2.517, 0.0]
    start_after: "B"
    plan_at_start: true
