# Salida desde C (06/11): robot sobre la cruz de C mirando a +X (hacia D). Último --params-file antes de
# initial_pose_corregida.yaml. plan_at_start: parado, mira alrededor (paneles de madera) y planifica desde aquí.
#   La pose de salida (rumbo e Y; la X, la de la cruz si no ve el fondo) la corrige el nodo al arrancar (start_pose_check).
fase1_node:
  ros__parameters:
    initial_pose: [2.078, 2.517, 0.0]
    start_after: "B"
    plan_at_start: true
