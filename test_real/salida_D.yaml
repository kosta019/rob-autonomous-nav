# Salida desde D (06/11): robot sobre la cruz de D mirando a +X (hacia D). Último --params-file antes de
# initial_pose_corregida.yaml. plan_at_start: parado, mira alrededor (paneles de madera) y planifica desde aquí.
#   comprobar_pose: ros2 run autonomous_nav comprobar_pose $CFG/fase1.yaml $CFG/real.yaml src/rob-autonomous-nav/test_real/salida_D.yaml --escribir
fase1_node:
  ros__parameters:
    initial_pose: [5.285, 2.517, 0.0]
    start_after: "D"
    plan_at_start: true
    max_linear_speed: 0.12       # primera prueba entre paneles: despacio
